# Trains the real GPT-2 + LoRA tagger on GitHub's machine and commits the results back
# (results/ and the Results section of README.md). Runs when the code or data changes, or by hand
# from the Actions tab ("Run workflow").
name: train-and-report
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "corpus/**", "examples/**", "requirements.txt", ".github/workflows/train.yml"]
permissions:
  contents: write
concurrency:
  group: train
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Train, merge, evaluate, tag the sample contract
        run: python -m app.cli train --update-readme README.md
      - name: Show how the saved model scores
        run: python -m app.cli evaluate
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results README.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add training results from GitHub Actions"
          git pull --rebase
          git push
